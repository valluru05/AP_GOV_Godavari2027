services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicproof-backend
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - PROJECT_NAME=CivicProof
      - VERSION=1.0.0
      - ENVIRONMENT=production
      - SECRET_KEY=civicproof-super-secure-production-secret-key-godavari-2027
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=sqlite:////app/data/civicproof.db
      - STORAGE_DIR=/app/data/storage
    volumes:
      - civicproof_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicproof-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  civicproof_data:
    driver: local
