services:
  db:
    image: postgres:16-alpine
    container_name: civicproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicproof_db}
      POSTGRES_USER: ${POSTGRES_USER:-civic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_secure_pass_godavari2027}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic_user} -d ${POSTGRES_DB:-civicproof_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicproof-backend
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - PROJECT_NAME=CivicProof
      - VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:-civicproof-super-secure-production-secret-key-godavari-2027}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://civic_user:civic_secure_pass_godavari2027@db:5432/civicproof_db}
      - STORAGE_DIR=/app/data/storage
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      - civicproof_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicproof-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  civicproof_data:
    driver: local
  postgres_data:
    driver: local
